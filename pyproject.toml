[project]
name = "telepc"
version = "0.1.0"
description = "Lab remote desktop control system with FastAPI, WebSocket relay, and consent-visible agent."
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pillow>=10.0",
  "pydantic-settings>=2.4",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.30",
  "websockets>=12.0"
]

[project.optional-dependencies]
real-agent = ["mss>=9.0", "opencv-python>=4.10", "psutil>=6.0", "pynput>=1.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

